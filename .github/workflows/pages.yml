name: Publicar site da disciplina

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Montar site estático
        run: |
          mkdir _site
          cp index.html styles.css favicon.svg .nojekyll _site/
          cp -r aulas vendor _site/
          cp -r "Apostilas e Relatorios" _site/
          # o LaTeX é fonte, não faz parte do site publicado
          rm -rf _site/aulas/*/beamer

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
